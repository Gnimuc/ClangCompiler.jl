[general]
library_name = "libclangex"
output_file_path = "LibClangEx.jl"
module_name = "LibClangEx"
export_symbol_prefixes = ["clang", "CX"]
prologue_file_path = "./prologue.jl"

use_deterministic_symbol = true
use_julia_native_enum_type = true
generate_isystem_symbols = false

output_ignorelist = [
    "LLVM_CLANG_C_EXTERN_C_BEGIN",
    "LLVM_CLANG_C_EXTERN_C_END",
    "REPL_BUILTIN_TYPES",
    "X",
    # X-macro machinery of the vendored StmtNodes.inc (see AST/CXStmt.h)
    "STMT",
    "ABSTRACT_STMT",
    "STMT_RANGE",
    "LAST_STMT_RANGE",
    # X-macro machinery of the vendored AttrList.inc (see AST/CXAttr.h)
    "ATTR",
    "ATTR_RANGE",
]

[codegen]
use_ccall_macro = true