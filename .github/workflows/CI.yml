name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # A hang should fail in minutes, not consume the 6-hour default: the healthy jobs
    # finish well under an hour, and the Windows loader hang ate the full limit twice.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        version:
          - '~1.13.0-0'
          # - 'pre'
          # - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          # `make` (msys) is required so CMake's "MSYS Makefiles" generator picks
          # msys2's own make instead of the runner image's C:/mingw64/bin/make.exe,
          # which is on the inherited PATH and cannot drive msys2's compilers.
          # `mingw-w64-x86_64-cmake` lets build_local.jl avoid CMake_jll's wrapper,
          # whose PATH injection breaks gcc's subprocesses (see build_local.jl).
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make
        if: runner.os == 'Windows'

      # build_ci.jl builds ClangExtra from source when deps/ClangExtra is newer
      # than the resolved libclangex_jll tag, otherwise uses the JLL. Its local-build
      # path is build_local.jl, so the msys2/cmake handling for Windows still applies.
      - name: Build ClangExtra
        run: julia --project=deps deps/build_ci.jl
        if: runner.os != 'Windows'

      - name: Build ClangExtra (in msys2)
        shell: msys2 {0}
        run: julia --project=deps deps/build_ci.jl
        if: runner.os == 'Windows'

      # TEMPORARY diagnostic for the Windows runtest hang: `using ClangCompiler` sat
      # nearly six hours with no output. The probe stages that exact load chain with a
      # marker before each step, under its own timeout, so a loader hang names its
      # stage in minutes. The probe runs without coverage; if it passes and runtest
      # still hangs, the difference is runtest's coverage flags.
      - name: Load probe
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: julia --project .github/scripts/load_probe.jl

      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          file: lcov.info
  bindings:
    # CI never regenerates bindings during test jobs, so a ClangExtra header
    # edited without rerunning gen/generator.jl would silently ship stale
    # bindings. This job regenerates and fails on any diff under lib/.
    name: Regenerated bindings match lib/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '~1.13.0-0'
          arch: x64
      - uses: actions/cache@v4
        env:
          cache-name: cache-gen-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-gen-${{ env.cache-name }}-${{ hashFiles('gen/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-gen-${{ env.cache-name }}-
      - run: julia --project=gen -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=gen gen/generator.jl
      - run: git diff --exit-code lib/
  examples:
    # The examples rotted silently once: they referenced `get_compiler_args` and `IRGenerator`,
    # removed years earlier, and every one of them failed at load. Nothing ran them, so nothing
    # said so. This job runs all six and fails on any of them.
    #
    # One platform is deliberate. These exercise the same parse/JIT path the test suite already
    # covers on all three (test/execution.jl); what is uncovered without this job is not a
    # platform difference, it is the documentation drifting from the API.
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '~1.13.0-0'
          arch: x64
      - uses: actions/cache@v4
        env:
          cache-name: cache-examples-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-examples-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-examples-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build ClangExtra
        run: julia --project=deps deps/build_ci.jl
      - name: Run every example
        run: julia --project examples/runall.jl
